events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Upstream cluster với cơ chế Active - Hot Standby
    upstream router_cluster {
        include /etc/nginx/upstream.conf;
    }

    server {
        listen 20128;
        server_name localhost;

        # Client body size lớn cho upload image/audio/multimodal requests
        client_max_body_size 128m;

        location / {
            proxy_pass http://router_cluster;
            proxy_http_version 1.1;

            # Forwarding headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Cấu hình tối quan trọng cho Server-Sent Events (SSE) & LLM Streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            chunked_transfer_encoding on;

            # Tự động chuyển mạch tức thời sang Node 2 nếu Node 1 đang tắt hoặc reboot
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}

services:
  # ========================================================
  # Pool 10 Node Japan (WireGuard NordVPN) - 10 IPs Riêng Biệt
  # ========================================================

  # Node 1: Japan (Tokyo - Server #866)
  nord-jp-1:
    image: qmcgaw/gluetun:latest
    container_name: nord-proxy-jp-1
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${NORDVPN_WIREGUARD_KEY}
      - SERVER_COUNTRIES=Japan
      - SERVER_HOSTNAMES=jp866.nordvpn.com
      - HTTPPROXY=on
      - SHADOWSOCKS=on
    ports:
      - "127.0.0.1:38201:8888" # HTTP Proxy JP 1
      - "127.0.0.1:38301:8388" # Shadowsocks JP 1

